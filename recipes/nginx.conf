# ==============================================================================
# Production Nginx Master Configuration for 100/100 PageSpeed & Core Web Vitals
# Part of pagespeed-optimizer-alexlivre (https://alexlivre.dev/)
# ==============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    root /var/www/example.com/public;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # 1. SSL/TLS Performance & Security
    # --------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --------------------------------------------------------------------------
    # 2. Dual Compression: Brotli (Primary) + Gzip (Fallback)
    # --------------------------------------------------------------------------
    # Brotli Compression (requires ngx_brotli module)
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-javascript
        application/xhtml+xml
        application/xml
        font/opentype
        font/otf
        font/ttf
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Gzip Compression Fallback
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/plain;

    # --------------------------------------------------------------------------
    # 3. Security & Isolation Headers (100 Best Practices Target)
    #
    # WARNING — nginx add_header inheritance: a `location` that declares ANY
    # add_header stops inheriting ALL add_header directives from the server block.
    # Sections 4 and 5 below each set Cache-Control, so this block would be
    # silently dropped for every asset AND for the HTML document itself — and
    # Lighthouse would fail `has-hsts` on the very request it audits. The headers
    # are therefore repeated inside those locations. Keep repeating them for any
    # location you add, or move this list into a snippets file you `include`.
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), unload=()" always;

    # --------------------------------------------------------------------------
    # 4. Static Asset Caching (1-Year Immutable Strategy)
    #
    # Immutable caching is only safe when the URL CHANGES with the file:
    # fingerprint the filename (app.a1b2c3.css) or append ?v=<hash>. Otherwise
    # visitors keep the old CSS for a year and a deploy appears to do nothing.
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2|woff|ttf|otf|avif|webp|png|jpg|jpeg|gif|svg|ico)$ {
        # Repeated: this location declares add_header, so it inherits none.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), unload=()" always;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 5. HTML Document Routing & Query String Preservation (Iron Law)
    # Ensures ?utm_source, ?gclid, ?fbclid are NEVER dropped during navigation
    # --------------------------------------------------------------------------
    location / {
        # Repeated: this location declares add_header, so it inherits none.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), unload=()" always;

        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html$is_args$args;
    }
}
